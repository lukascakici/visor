# The Xcode project is generated from this file, so the project itself stays
# reviewable: run `xcodegen generate` in this directory after changing anything
# here. The generated Visor.xcodeproj is committed as well, so the app can be
# opened and run without installing anything.
name: Visor
options:
  bundleIdPrefix: com.visor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Visor:
    path: ../Visor

targets:
  Visor:
    type: application
    platform: iOS
    # A shared scheme, so the project builds the same way from Xcode and from
    # the command line, and so the package dependencies get resolved either way.
    scheme: {}
    sources:
      - path: Sources
    dependencies:
      - package: Visor
        product: Core
      - package: Visor
        product: Geometry
      - package: Visor
        product: Guidance
      - package: Visor
        product: Routing
      - package: Visor
        product: Simulation
      - package: Visor
        product: Transport
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Visor
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Guidance has to keep running with the screen off and the phone in a
        # tank bag, and the HUD has to keep being written to while it does.
        UIBackgroundModes:
          - location
          - bluetooth-central
        NSLocationWhenInUseUsageDescription:
          Visor uses your location to follow the route and tell you about the next turn.
        NSLocationAlwaysAndWhenInUseUsageDescription:
          Visor keeps following the route while the screen is off, so the display on your
          helmet keeps working during the ride.
        NSBluetoothAlwaysUsageDescription:
          Visor connects to your heads-up display over Bluetooth to send it the next turn.
    settings:
      base:
        # Signing lives here rather than being set by hand in Xcode, because
        # the project is generated: anything typed into Signing & Capabilities
        # is thrown away by the next `xcodegen generate`. An identifier nobody
        # else has taken, since running on a real phone means registering it.
        PRODUCT_BUNDLE_IDENTIFIER: com.visor.app.lukas
        DEVELOPMENT_TEAM: B2637CWA3C
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        # Swift 5 language mode on purpose: the concurrency checking that
        # Swift 6 turns on is a separate piece of work from getting the app on
        # screen, and mixing the two would confuse both.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
