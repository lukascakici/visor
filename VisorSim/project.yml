# Generated with XcodeGen; see ../VisorApp/project.yml for the same setup on the
# phone side. Run `xcodegen generate` here after changing anything.
name: VisorSim
options:
  bundleIdPrefix: com.visor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Visor:
    path: ../Visor

targets:
  VisorSim:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Sources
      # The firmware's own rendering, built into the simulator so the preview
      # shows the device's pixels rather than an impression of them. The two
      # platform files are left out: they are NimBLE and a panel driver, and
      # neither exists on a Mac.
      - path: ../Firmware/main
        excludes:
          - "visor_ble.c"
          - "visor_panel.c"
          - "main.c"
    dependencies:
      - package: Visor
        product: Core
      - package: Visor
        product: Guidance
      - package: Visor
        product: Simulation
      - package: Visor
        product: Transport
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Visor HUD Simulator
        LSMinimumSystemVersion: "14.0"
        # CoreBluetooth refuses to start without this, on macOS as much as on
        # iOS, even to act as a peripheral.
        NSBluetoothAlwaysUsageDescription:
          The simulator advertises itself as a Visor heads-up display so the phone
          has something to connect to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visor.sim
        SWIFT_OBJC_BRIDGING_HEADER: Sources/VisorSim-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../Firmware/main
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        # Signed with a development identity rather than ad hoc, and the reason
        # is Bluetooth. macOS ties the permission to the code signature, and an
        # ad hoc signature is different after every build, so the grant is
        # thrown away each time the app is rebuilt. Half an hour of "not allowed
        # to use Bluetooth" is what that costs.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: B2637CWA3C
        ENABLE_HARDENED_RUNTIME: NO
